services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tdp_sql_server
    env_file:
      - .env
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tdp_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - sqlserver
    restart: always

  frontend:
      build: ./frontend
      container_name: tdp_frontend
      env_file:
        - .env
      ports:
        - "5173:5173"
      depends_on:
        - backend
      restart: always

volumes:
  mssql_data: