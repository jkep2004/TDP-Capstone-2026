
name: CI/CD Pipeline

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          sudo mkdir -p /usr/share/keyrings

          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg

          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt

      - name: Verify ODBC driver
        run: |
          odbcinst -q -d

      - name: Run automated tests with pytest
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_DRIVER: ODBC Driver 18 for SQL Server
        run: |
          pytest --continue-on-collection-errors

      - name: Install Bandit
        run: |
          python -m pip install bandit

      - name: Run Bandit SAST
        run: |
          bandit -r src -x src/tests

  development-docker:
    name: Build and Publish Development Images
    runs-on: ubuntu-latest

    needs: build-and-test

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: image
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "backend=$IMAGE_PREFIX-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$IMAGE_PREFIX-frontend" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish FastAPI Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.backend }}:unstable
            ${{ steps.image.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Build and Publish Vite Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.frontend }}:unstable
            ${{ steps.image.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Docker Publishing Summary
        if: github.event_name == 'push'
        run: |
          echo "Successfully published development images:"
          echo "${{ steps.image.outputs.backend }}:unstable"
          echo "${{ steps.image.outputs.backend }}:${GITHUB_SHA}"
          echo "${{ steps.image.outputs.frontend }}:unstable"
          echo "${{ steps.image.outputs.frontend }}:${GITHUB_SHA}"

  production-docker:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest

    needs: build-and-test

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tags
        id: image
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "backend=$IMAGE_PREFIX-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$IMAGE_PREFIX-frontend" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish FastAPI Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.backend }}:latest
            ${{ steps.image.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Build and Publish Vite Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.frontend }}:latest
            ${{ steps.image.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Docker Publishing Summary
        if: github.event_name == 'push'
        run: |
          echo "Successfully published production images:"
          echo "${{ steps.image.outputs.backend }}:latest"
          echo "${{ steps.image.outputs.backend }}:${GITHUB_SHA}"
          echo "${{ steps.image.outputs.frontend }}:latest"
          echo "${{ steps.image.outputs.frontend }}:${GITHUB_SHA}"
