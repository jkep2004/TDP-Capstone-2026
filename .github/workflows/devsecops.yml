name: CI Build and Test Pipeline  # CI Build and Test Pipeline

# Trigger conditions: Triggered when code is pushed to main or dev branch, or a PR is raised
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
    # Step 1: Checkout repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python environment (Using Python 3.14 as required by the learner brief)
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # Step 3: Upgrade pip and install dependencies from requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements-dev.txt

    # Step 4: Run automated tests (if pytest is included in the project)
    - name: Run automated tests with pytest
      run: |
        pytest