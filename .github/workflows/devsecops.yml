name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "dev", "fix/azure_workflow_fix"]
  pull_request:
    branches: ["main", "dev", "fix/azure_workflow_fix"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. BUILD & SECRETS GATE
  # ==========================================
  build:
    name: 1. Build & Secrets Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets Management Gate (Block .env & .tfstate)
        run: |
          BLOCKED_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.tfstate(\.|$)' || true)
          if [ -n "$BLOCKED_FILES" ]; then
            echo "::error::Security Policy Violation! Sensitive files detected in repository:"
            echo "$BLOCKED_FILES"
            exit 1
          fi
          echo "Secrets baseline check passed."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Backend Syntax & Build
        run: |
          python -m py_compile $(find api -name "*.py")

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Frontend Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm test

  # ==========================================
  # 2. UNIT TEST & FUNCTIONAL QUALITY
  # ==========================================
  test:
    name: 2. Unit & Functional Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt

      # login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}

      # dynamically open Azure SQL Firewall for the current Runner's IP
      - name: Open Azure SQL Firewall
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org || curl -sf https://ifconfig.me)
          RULE_NAME="gh-actions-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "FIREWALL_RULE_NAME=$RULE_NAME" >> $GITHUB_ENV

          az sql server firewall-rule create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server "${{ secrets.AZURE_SQL_SERVER_NAME }}" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

          # wait a few seconds to ensure the Azure firewall rule takes effect
          sleep 10

      - name: Run Pytest & Generate Report
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_DRIVER: ODBC Driver 18 for SQL Server
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_JWT_ALGORITHM: ${{ secrets.APP_JWT_ALGORITHM }}
          APP_JWT_EXPIRE_MINUTES: ${{ secrets.APP_JWT_EXPIRE_MINUTES }}
        run: |
          pytest --continue-on-collection-errors --junitxml=pytest-report.xml

      # close Azure SQL Firewall regardless of test outcome
      - name: Close Azure SQL Firewall
        if: always() && env.FIREWALL_RULE_NAME != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server "${{ secrets.AZURE_SQL_SERVER_NAME }}" \
            --name "${{ env.FIREWALL_RULE_NAME }}"

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2-unit-test-report
          path: pytest-report.xml

  # ==========================================
  # 2b. BROWSER END-TO-END TESTS
  # ==========================================
  e2e:
    name: 2b. Browser End-to-End Tests
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies and SQL Server driver
        run: |
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          python -m pip install -r api/requirements-dev.txt

      - name: Start and seed the temporary SQL Server database
        env:
          DB_SERVER: '127.0.0.1,1433'
          DB_NAME: CapstoneE2E
          DB_ADMIN_USER: sa
        run: |
          export MSSQL_SA_PASSWORD="E2e!$(openssl rand -hex 20)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "E2E_SQL_PASSWORD=$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"
          docker run --detach --rm --name capstone-e2e-sql \
            --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest
          deadline=$((SECONDS + 90))
          until docker exec capstone-e2e-sql bash -c \
            'exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -l 2 -Q "SELECT 1"' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error::Temporary SQL Server did not become ready"
              exit 1
            fi
            sleep 2
          done
          DB_ADMIN_PASSWORD="$MSSQL_SA_PASSWORD" python infra/database/init_db.py --with-test-data

      - name: Install frontend dependencies and Chromium
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test spending and insights in Chromium
        working-directory: ./frontend
        run: npm run test:e2e

  # ==========================================
  # 3. SAST (STATIC APPLICATION SECURITY TESTING)
  # ==========================================
  sast:
    name: 3. SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit SAST (Block Medium & High)
        run: |
          # First generate a complete report for archiving, then run the scan with blocking thresholds (-ll = Medium & High)
          bandit -r api -x api/tests -f json -o bandit-report.json || true
          bandit -r api -x api/tests -ll

      - name: Upload SAST Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3-sast-bandit-report
          path: bandit-report.json

  # ==========================================
  # 4. SCA (SOFTWARE COMPOSITION ANALYSIS)
  # ==========================================
  sca:
    name: 4. SCA (Dependency Audit)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          python -m pip_audit -r api/requirements.txt -f json -o pip-audit-app.json
          python -m pip_audit -r api/requirements-dev.txt -f json -o pip-audit-dev.json

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high --json > ../npm-audit-report.json || npm audit --audit-level=high

      - name: Upload SCA Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4-sca-dependency-reports
          path: |
            pip-audit-app.json
            pip-audit-dev.json
            npm-audit-report.json

  # ==========================================
  # 5. DAST (DYNAMIC APPLICATION SECURITY TESTING)
  # ==========================================
  dast:
    name: 5. DAST (API Dynamic Security)
    runs-on: ubuntu-latest
    needs: [test, sast, sca]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install App & DAST Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt httpx uvicorn

      - name: Start API & Run DAST Checks on POST /calculate
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_DRIVER: ODBC Driver 18 for SQL Server
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_JWT_ALGORITHM: ${{ secrets.APP_JWT_ALGORITHM }}
          APP_JWT_EXPIRE_MINUTES: ${{ secrets.APP_JWT_EXPIRE_MINUTES }}
        run: |
          python -m uvicorn src.main:app --app-dir api --host 127.0.0.1 --port 8000 > api-server.log 2>&1 &

          # wait for API to be ready (up to 15 seconds)
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "API is ready."
              break
            fi
            sleep 1
          done

          python - << 'EOF' | tee dast-report.txt
          import httpx

          client = httpx.Client(base_url="http://127.0.0.1:8000", timeout=10.0)
          endpoint = "/api/v1/calculate"

          tests = [
              ("Invalid Input / Unexpected Params", {"invalid_field": "malformed", "extra": 999}),
              ("SQL Injection Payload Attempt", {"activity": "' OR 1=1 --", "amount": -100}),
              ("Empty Payload", {}),
          ]

          for name, payload in tests:
              resp = client.post(endpoint, json=payload)
              print(f"[DAST] {name} -> HTTP {resp.status_code}")
              assert resp.status_code in [400, 401, 403, 422], f"Unexpected status {resp.status_code}"
              assert "Traceback" not in resp.text, "Security Risk: Stack trace exposed!"
              assert "pyodbc" not in resp.text.lower(), "Security Risk: DB driver details exposed!"

          print("[DAST] All dynamic security checks passed.")
          EOF

      - name: Upload DAST Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5-dast-security-report
          path: |
            dast-report.txt
            api-server.log

  # ==========================================
  # 6. PUBLISH DOCKER IMAGES (GATED BY ALL CHECKS)
  # ==========================================
  publish-docker:
    name: 6. Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build, test, e2e, sast, sca, dast]
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image.outputs.backend }}:${{ github.sha }}
      frontend_image: ${{ steps.image.outputs.frontend }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dynamic Image Tags
        id: image
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=$IMAGE_PREFIX-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$IMAGE_PREFIX-frontend" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_BASE_REF}" == "main" ]]; then
            echo "env_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=unstable" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish FastAPI Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.backend }}:${{ steps.image.outputs.env_tag }}
            ${{ steps.image.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Build and Publish Vite Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.frontend }}:${{ steps.image.outputs.env_tag }}
            ${{ steps.image.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}
            VITE_ENTRA_API_CLIENT_ID=${{ secrets.VITE_ENTRA_API_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

  # ==========================================
  # 7. DEPLOY TO AZURE CONTAINER APPS
  # ==========================================
  deploy:
    name: 7. Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish-docker
    if: github.event_name == 'push'
    env:
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      BACKEND_APP_NAME: ca-tdp2026-carbon-team3-api-dev
      FRONTEND_APP_NAME: ca-tdp2026-carbon-team3-web-dev

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}

      - name: Deploy Backend Container App
        run: |
          az containerapp update \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.publish-docker.outputs.backend_image }}"

      - name: Deploy Frontend Container App
        run: |
          az containerapp update \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.publish-docker.outputs.frontend_image }}"