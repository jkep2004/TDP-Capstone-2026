
name: Environment File Security Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  env-security-check:
    name: Block .env Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for prohibited environment files
        run: |
          BLOCKED_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)

          if [ -n "$BLOCKED_FILES" ]; then
            echo "::error::Security policy violation!"
            echo "Environment files detected:"
            echo "$BLOCKED_FILES"
            exit 1
          fi

          echo "Security check passed."
