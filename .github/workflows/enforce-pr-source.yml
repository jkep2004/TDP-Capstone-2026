
name: PR Source Branch Policy

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  validate-pr-source:
    name: validate-pr-source
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ "$SOURCE_BRANCH" != "dev" || "$SOURCE_REPO" != "$TARGET_REPO" ]]; then
              echo "ERROR: Only dev can merge into main."
              exit 1
            fi

          elif [[ "$TARGET_BRANCH" == "dev" ]]; then
            case "$SOURCE_BRANCH" in
              feature/*|bugfix/*)
                echo "Valid source branch: $SOURCE_BRANCH"
                ;;
              *)
                echo "ERROR: Only feature/* or bugfix/* branches can merge into dev."
                exit 1
                ;;
            esac
          fi

          echo "PR source branch validation passed."
