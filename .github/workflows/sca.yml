
name: SCA Dependency Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: pip-audit SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Scan application dependencies
        run: |
          python -m pip_audit -r src/requirements.txt

      - name: Scan development dependencies
        run: |
          python -m pip_audit -r src/requirements-dev.txt
